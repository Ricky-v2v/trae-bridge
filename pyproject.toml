[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trae-bridge"
version = "1.0.0"
description = "REST API bridge for Trae AI IDE via Chrome DevTools Protocol"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Trae Bridge Contributors"}
]
keywords = ["trae", "ai", "api", "bridge", "cdp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "websockets>=11.0",
    "aiohttp>=3.8",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "requests>=2.28",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
trae-bridge = "scripts.bridge:main"
trae-bridge-client = "scripts.client:main"
trae-bridge-inspect = "scripts.inspect_dom:main"

[project.urls]
Homepage = "https://github.com/yourusername/trae-bridge"
Repository = "https://github.com/yourusername/trae-bridge"
Issues = "https://github.com/yourusername/trae-bridge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
